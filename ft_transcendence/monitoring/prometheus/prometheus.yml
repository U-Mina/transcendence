global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
  external_labels:
    project: transcendence
    environment: development

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
        - prometheus:9090
  
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
        - api-gateway:3000

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets:
        - user-service:3001
  
  - job_name: event-service
    metrics_path: /metrics
    static_configs:
      - targets:
        - event_service:3002