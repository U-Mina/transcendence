global:
  resolve_timeout: 5m

  smtp_smarthost: smtp.gmail.com:587
  smtp_from: transcendence.alerts@gmail.com
  smtp_auth_username: transcendence.alerts@gmail.com
  smtp_auth_password_file: /run/secrets/gmail_app_password
  smtp_require_tls: true

route:
  receiver: gmail-alerts

  group_by:
    - alertname
    - job

  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: gmail-alerts
    email_configs:
      - to: transcendencealerts@gmail.com
        send_resolved: true