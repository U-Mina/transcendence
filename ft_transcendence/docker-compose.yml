services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: transcendence-database
    restart: unless-stopped

    command:
      - "--ssl-ca=/certs/ca/ca.crt"
      - "--ssl-cert=/certs/database/database.crt"
      - "--ssl-key=/certs/database/database.key"
      - "--require-secure-transport=ON"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./.certificates/database:/certs/database:ro
      - ./.certificates/ca:/certs/ca:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --ssl-mode=REQUIRED --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  user-service:
    image: node:20-alpine
    container_name: transcendence-user-service
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./services/user-service:/app
      - user_service_node_modules:/app/node_modules
      - ./.certificates/user-service:/certs/user-service:ro
      - ./.certificates/ca:/certs/ca:ro

    environment:
      PORT: 3001

      TLS_CERT_PATH: /certs/user-service/user-service.crt
      TLS_KEY_PATH: /certs/user-service/user-service.key
      NODE_EXTRA_CA_CERTS: /certs/ca/ca.crt

      DATABASE_HOST: database
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/user_service?sslaccept=accept_invalid_certs
      SHADOW_DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/user_service_shadow?sslaccept=accept_invalid_certs
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "${USER_SERVICE_PORT}:3001"

    depends_on:
      database:
        condition: service_healthy


  event-service:
    image: node:20-alpine
    container_name: transcendence-event-service
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./services/event-service:/app
      - event_service_node_modules:/app/node_modules
      - ./.certificates/event-service:/certs/event-service:ro
      - ./.certificates/ca:/certs/ca:ro

    environment:
      PORT: 3002

      TLS_CERT_PATH: /certs/event-service/event-service.crt
      TLS_KEY_PATH: /certs/event-service/event-service.key
      NODE_EXTRA_CA_CERTS: /certs/ca/ca.crt

      DATABASE_HOST: database
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/event_service?sslaccept=accept_invalid_certs
      SHADOW_DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/event_service_shadow?sslaccept=accept_invalid_certs
      USER_SERVICE_URL: https://user-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "${EVENT_SERVICE_PORT}:3002"

    depends_on:
      database:
        condition: service_healthy
      user-service:
        condition: service_started


  api-gateway:
    image: node:20-alpine
    container_name: transcendence-api-gateway
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev"

    volumes:
      - ./apps/api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
      - ./.certificates/api-gateway:/certs/api-gateway:ro
      - ./.certificates/ca:/certs/ca:ro

    environment:
      PORT: 3000

      TLS_CERT_PATH: /certs/api-gateway/api-gateway.crt
      TLS_KEY_PATH: /certs/api-gateway/api-gateway.key
      NODE_EXTRA_CA_CERTS: /certs/ca/ca.crt

      USER_SERVICE_URL: https://user-service:3001
      EVENT_SERVICE_URL: https://event-service:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      DEV_API_KEY: ${DEV_API_KEY}

    ports:
      - "${API_GATEWAY_PORT}:3000"

    depends_on:
      user-service:
        condition: service_started
      event-service:
        condition: service_started


  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web.yml"

    ports:
      - "${PROMETHEUS_PORT}:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/web.yml:/etc/prometheus/web.yml:ro
      - ./.certificates/prometheus:/certs/prometheus:ro
      - ./.certificates/ca:/certs/ca:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro


  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD}

      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /certs/grafana/grafana.crt
      GF_SERVER_CERT_KEY: /certs/grafana/grafana.key

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.certificates/grafana:/certs/grafana:ro
      - ./.certificates/ca:/certs/ca:ro

    depends_on:
      - prometheus


  alertmanager:
    image: prom/alertmanager:latest
    container_name: transcendence-alertmanager
    restart: unless-stopped

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.config.file=/etc/alertmanager/web.yml"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/web.yml:/etc/alertmanager/web.yml:ro
      - ./.certificates/alertmanager:/certs/alertmanager:ro
      - alertmanager_data:/alertmanager

    ports:
      - "${ALERTMANAGER_PORT}:9093"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"

    env_file:
      - .env

    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"

    environment:
      REACT_APP_ENV: ${NODE_ENV}
      PORT: ${FRONTEND_PORT}
      VITE_PROXY_TARGET: https://api-gateway:3000
      NODE_EXTRA_CA_CERTS: /certs/ca/ca.crt

    volumes:
      - frontend_node_modules:/app/node_modules
      - ./.certificates/ca:/certs/ca:ro

    depends_on:
      api-gateway:
        condition: service_started


volumes:
  mysql_data:
  user_service_node_modules:
  event_service_node_modules:
  api_gateway_node_modules:
  grafana_data:
  frontend_node_modules:
  alertmanager_data: